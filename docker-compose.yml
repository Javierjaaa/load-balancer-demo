version: '3'

services:
  web1:
    image: nginx:alpine
    volumes:
      - ./web1:/usr/share/nginx/html:ro
    ports:
      - "81:80"

  web2:
    image: nginx:alpine
    volumes:
      - ./web2:/usr/share/nginx/html:ro
    ports:
      - "82:80"

  balanceador:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web1
      - web2
